<div class="card shadow-sm border-0">

    <div class="card-body p-4">

        <h5 class="fw-bold mb-4">
            {{ bookId() ? 'Update Book' : 'Add New Book' }}

        </h5>

        <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">

            <!-- Title -->
            <div class="mb-3">

                <label for="title" class="form-label">
                    Title <span class="text-danger">*</span>
                </label>

                <input id="title" type="text" class="form-control" formControlName="title"
                    placeholder="Enter book title" />

                @if (
                bookForm.controls.title.touched &&
                bookForm.controls.title.invalid
                ) {
                <div class="text-danger small mt-1">
                    Title must be at least 2 characters.
                </div>
                }

            </div>


            <!-- Author -->
            <div class="mb-3">

                <label for="author" class="form-label">
                    Author <span class="text-danger">*</span>
                </label>

                <input id="author" type="text" class="form-control" formControlName="author"
                    placeholder="Enter author name" />

                @if (
                bookForm.controls.author.touched &&
                bookForm.controls.author.invalid
                ) {
                <div class="text-danger small mt-1">
                    Author must be at least 2 characters.
                </div>
                }

            </div>


            <!-- Image -->
            <div class="mb-3">

                <label for="image" class="form-label">
                    Cover Image <span class="text-danger">*</span>
                </label>

                <input id="image" type="file" class="form-control" accept="image/*"
                    (change)="onImageSelected($event)" />

            </div>


            <!-- Rating -->
            <div class="mb-3">

                <label for="rating" class="form-label">
                    Rating (1 - 5) <span class="text-danger">*</span>
                </label>

                <select id="rating" class="form-select" formControlName="rating">
                    <option [value]="1">1</option>
                    <option [value]="2">2</option>
                    <option [value]="3">3</option>
                    <option [value]="4">4</option>
                    <option [value]="5">5</option>
                </select>

            </div>


            <!-- Status -->
            <div class="mb-4">

                <label for="status" class="form-label">
                    Status <span class="text-danger">*</span>
                </label>

                <select id="status" class="form-select" formControlName="status">
                    <option value="Want to Read">
                        Want to Read
                    </option>

                    <option value="Currently Reading">
                        Currently Reading
                    </option>

                    <option value="Read">
                        Read
                    </option>
                </select>

            </div>


            <!-- Submit -->
            <button type="submit" class="btn btn-primary w-100" [disabled]="bookForm.invalid">
                @if (bookId()) {
                    <i class="bi bi-pencil me-1"></i>
                } @else {
                    <i class="bi bi-plus-circle me-1"></i>
                }
                {{ bookId() ? 'Update Book' : 'Add Book' }}
            </button>

        </form>

    </div>

</div>
